<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Page 💭</title>

    <style>
        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: #ffeef7;
            color: #333;
            text-align: center;
            padding: 20px;
            overflow-x: hidden;
        }

        h1 {
            color: #ff2d6f;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .main-photo {
            width: 80%;
            max-width: 400px;
            border-radius: 20px;
            box-shadow: 0 6px 15px rgba(255, 100, 150, 0.3);
            margin-top: 20px;
        }

        .question {
            margin-top: 25px;
            font-size: 1.4rem;
            font-weight: 600;
            color: #d63384;
        }

        .choices {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .choices button {
            padding: 15px 35px;
            font-size: 1.2rem;
            background: #ff2d6f;
            color: white;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 80, 150, 0.4);
            transition: 0.2s;
        }

        .choices button:hover {
            transform: scale(1.1);
            background: #e0215c;
        }

        /* POPUP MODAL */
        .popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .popup-box {
            background: white;
            padding: 30px;
            width: 90%;
            max-width: 350px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            animation: pop 0.3s ease-out;
        }

        .popup-box h2, h5 {
            color: #ff2d6f;
            margin-bottom: 20px;
        }

        .popup-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .popup-buttons button {
            padding: 10px 25px;
            background: #ff2d6f;
            color: white;
            border-radius: 10px;
            text-decoration: none;
            transition: 0.2s;
        }

        .popup-buttons button:hover {
            transform: scale(1.1);
            background: #e0215c;
        }

        @keyframes pop {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Floating hearts (cute decorations) */
        .heart {
            position: fixed;
            bottom: -20px;
            left: calc(10% + (80% * var(--rand)));
            width: 18px;
            height: 18px;
            background: #ff2d6f;
            transform: rotate(45deg);
            animation: float 6s linear infinite;
            opacity: 0.7;
            border-radius: 3px;
            z-index: -1;
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            background: #ff2d6f;
            border-radius: 50%;
        }
        .heart::before { top: -9px; left: 0; }
        .heart::after  { top: 0; left: -9px; }

        @keyframes float {
            0% { transform: translateY(0) rotate(45deg); opacity: 0.8; }
            100% { transform: translateY(-120vh) rotate(45deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <h1>💖 A Little Question 💖</h1>

    <img src="image/ani.jpg" class="main-photo">

    <div class="question">
        Will you love me forever? 😳💞
    </div>

    <div class="choices">
        <button onclick="openPopup()">YES 💗</button>
        <button onclick="openPopup()">YES 😭</button>
    </div>

    <!-- POPUP -->
    <div class="popup" id="popup">
        <div class="popup-box">
            <h2>Will you be my girlfriend?😳❤️</h2>
            <h5>This is a serious question babi</h5>
            <div class="popup-buttons">
            <button onclick="location.href='yes.html'">YES</button>
            <button onclick="location.href='no.html'">NO</button>
            </div>
           
        </div>
    </div>

    <script>
        function openPopup() {
            document.getElementById("popup").style.display = "flex";
        }
    </script>

    <!-- Cute floating hearts -->
    <div class="heart" style="--rand:0.1;"></div>
    <div class="heart" style="--rand:0.3;"></div>
    <div class="heart" style="--rand:0.5;"></div>
    <div class="heart" style="--rand:0.7;"></div>
    <div class="heart" style="--rand:0.9;"></div>

</body>
</html>
