<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Oh… 😞</title>
<style>
    body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        background: #1b1b1b;
        height: 100vh;
        overflow: hidden;
        text-align: center;
    }

    h1 {
        color: #bbbbbb;
        margin-top: 150px;
        font-size: 3rem;
        animation: fadeIn 1.5s, shake 4s infinite;
    }

    p {
        color: #888;
        font-size: 1.2rem;
        animation: fadeIn 2s ease;
    }

    /* Back button */
    .back {
        position: absolute;
        bottom: 20px;
        left: 20px;
        background: #333;
        padding: 10px 18px;
        border-radius: 10px;
        color: white;
        text-decoration: none;
        font-weight: 600;
        transition: 0.2s;
    }
    .back:hover {
        transform: scale(1.1);
        background: #444;
    }

    /* Fade */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    /* Shake sad */
    @keyframes shake {
        0%,100% { transform: translateX(0); }
        50%     { transform: translateX(-5px); }
    }

    /* Rain */
    .rain {
        position: fixed;
        width: 2px;
        height: 15px;
        background: rgba(200,200,200,0.5);
        top: -20px;
        animation: drop 1s linear infinite;
    }

    @keyframes drop {
        to { transform: translateY(110vh); }
    }
</style>
</head>
<body>

<h1>Oh… that hurts 😔💔</h1>
<p>I guess I'll just sit here in the rain… alone…</p>

<a class="back" href="page5.html">⬅ Back</a>

<script>
    function createRain() {
        let drop = document.createElement("div");
        drop.className = "rain";
        drop.style.left = Math.random() * window.innerWidth + "px";
        drop.style.animationDuration = (0.7 + Math.random()) + "s";
        document.body.appendChild(drop);

        setTimeout(() => drop.remove(), 2000);
    }

    setInterval(createRain, 50);
</script>

</body>
</html>
