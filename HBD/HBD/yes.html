<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YAY!!! 💖</title>
<style>
    body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        background: linear-gradient(to bottom right, #ff9acb, #ffd5ec);
        overflow: hidden;
        text-align: center;
    }

    h1 {
        color: white;
        font-size: 3rem;
        margin-top: 120px;
        animation: fadeIn 1.5s ease;
        text-shadow: 0 4px 10px rgba(255, 0, 100, 0.4);
    }

    p {
        color: white;
        font-size: 1.3rem;
        animation: fadeIn 2.3s ease;
    }

    /* Back button */
    .back {
        position: absolute;
        bottom: 20px;
        left: 20px;
        background: white;
        padding: 10px 18px;
        border-radius: 10px;
        color: #ff2d6f;
        text-decoration: none;
        font-weight: 600;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        transition: 0.2s;
    }
    .back:hover {
        transform: scale(1.1);
    }

    /* Fade animation */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    /* Floating hearts */
    .heart {
        position: fixed;
        bottom: -20px;
        width: 18px;
        height: 18px;
        background: #ff2d6f;
        transform: rotate(45deg);
        animation: floatUp 6s linear infinite;
        opacity: 0.7;
        border-radius: 3px;
    }

    .heart::before,
    .heart::after {
        content: "";
        position: absolute;
        width: 18px;
        height: 18px;
        background: #ff2d6f;
        border-radius: 50%;
    }

    .heart::before { top: -9px; left: 0; }
    .heart::after  { top: 0; left: -9px; }

    @keyframes floatUp {
        0% { transform: translateY(0) rotate(45deg); opacity: 0.8; }
        100% { transform: translateY(-120vh) rotate(45deg); opacity: 0; }
    }
</style>
</head>
<body>

<h1>YAYYYY!!! 💖🥹</h1>
<p>Message mo sakin pag yes haaaa HAHAHAHAH 💗</p>

<a class="back" href="page5.html">⬅ Back</a>

<script>
    function createHeart() {
        let heart = document.createElement("div");
        heart.className = "heart";
        heart.style.left = Math.random() * window.innerWidth + "px";
        heart.style.animationDuration = (4 + Math.random() * 4) + "s";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 6000);
    }

    setInterval(createHeart, 300);
</script>

</body>
</html>
